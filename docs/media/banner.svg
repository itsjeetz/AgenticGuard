<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="240" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d021a"/>
      <stop offset="50%" stop-color="#17042b"/>
      <stop offset="100%" stop-color="#080112"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a100ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a100ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a100ff"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Rounded Border -->
  <rect x="2" y="2" width="956" height="236" rx="16" fill="url(#bgGrad)" stroke="#3b1366" stroke-width="2"/>
  <rect x="2" y="2" width="956" height="236" rx="16" fill="url(#purpleGlow)"/>

  <!-- Decorative Matrix / Circuit Lines -->
  <g opacity="0.18" stroke="#a100ff" stroke-width="1">
    <line x1="60" y1="40" x2="260" y2="40"/>
    <line x1="260" y1="40" x2="290" y2="70"/>
    <line x1="700" y1="40" x2="900" y2="40"/>
    <line x1="670" y1="70" x2="700" y2="40"/>
    <line x1="60" y1="200" x2="300" y2="200"/>
    <line x1="660" y1="200" x2="900" y2="200"/>
    <circle cx="290" cy="70" r="3" fill="#a100ff"/>
    <circle cx="670" cy="70" r="3" fill="#a100ff"/>
    <circle cx="300" cy="200" r="3" fill="#a100ff"/>
    <circle cx="660" cy="200" r="3" fill="#a100ff"/>
  </g>

  <!-- Center Shield Icon -->
  <g transform="translate(140, 52)">
    <!-- Outer Glow Shield -->
    <path d="M68 6 L124 28 C124 76 96 116 68 130 C40 116 12 76 12 28 Z" 
          fill="none" stroke="#a100ff" stroke-width="5" filter="url(#glow)" opacity="0.6"/>
    <!-- Solid Shield -->
    <path d="M68 8 L122 29 C122 74 95 112 68 126 C41 112 14 74 14 29 Z" 
          fill="#170529" stroke="url(#shieldGrad)" stroke-width="3"/>
    <!-- Inner Cyber Lines -->
    <path d="M68 24 L104 38 C104 70 86 96 68 108 C50 96 32 70 32 38 Z" 
          fill="none" stroke="#a100ff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>
    <!-- Lock / Core Motif -->
    <rect x="54" y="62" width="28" height="22" rx="4" fill="#a100ff"/>
    <path d="M59 62 V54 C59 48 77 48 77 54 V62" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="68" cy="71" r="2.5" fill="#ffffff"/>
    <line x1="68" y1="73.5" x2="68" y2="78" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <!-- Title: AGENTICGUARD -->
  <text x="300" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="54" font-weight="900" letter-spacing="3" fill="url(#textGrad)">
    AGENTIC<tspan fill="#a100ff">GUARD</tspan>
  </text>

  <!-- Tagline Badge -->
  <g transform="translate(300, 134)">
    <rect x="0" y="0" width="490" height="28" rx="6" fill="#25093d" stroke="#5b188f" stroke-width="1"/>
    <text x="14" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="12" font-weight="700" letter-spacing="1.5" fill="#e9d5ff">
      PROMPT INJECTION FIREWALL FOR AI AGENTS &bull; DEFENSE IN DEPTH
    </text>
  </g>

  <!-- Subtitle Specs -->
  <text x="302" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="13" font-weight="500" fill="#a78bfa" letter-spacing="0.5">
    11 Carriers Ingested &bull; MappedText Coordinates &bull; Spotlighting Envelopes &bull; Runtime Guards G1–G3
  </text>
</svg>
